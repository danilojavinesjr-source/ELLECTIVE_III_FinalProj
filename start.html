<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Dormitory</title>
<link rel="icon" type="image/png" href="logo.png">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;

        background-image: url('leaves.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;

        color: white;
    }

    .container {
        text-align: center;
        background:   rgba(12, 5, 111, 0.8);
        width: 650px;
        height: 550px;
        border-radius: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
     
    }
    .logo-container {
        margin-bottom: 2px; 
    }
    .main-logo {
        width: 220px; 
        height: auto;
        display: block;
        filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.3)); 
        opacity: 70%;
        border-radius: 100%;
    }

    .contact-info {
        margin-top: 30px;
        text-align: center;
        color: white;
        font-size: 13px;
        line-height: 1.8;
        opacity: 0.9;
    }

    .contact-info p {
        padding-top: 3px;
    }

    .contact-info span {
        color: cyan;
        font-weight: bold;
    }

    .headerTittle {
        font-size: 28px;
        font-weight: bold;
        margin-top: 20px;
        font-family: "Palatino Linotype", serif;
    }

    .lowersubtitle {
        font-size: 20px;
        opacity: 0.9;
        margin-bottom: 30px;
        font-family: "Brush Script MT", cursive;
    }

    .selectionFrame {
        display: flex;
        gap: 20px;
        justify-content: center;
        
        background-image: url('cover.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border: 1px solid rgba(225,225, 225, 0.5);
    }
    

    .select_subt {
        color: White;
        font-family: "Castellar";
        font-size: 30px;



    }

    

    .choices {
        display: flex;
        gap: 30px;
        justify-content: center;
    }

    .card {
        width: 250px;
        height: 150px;
        border-radius: 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        transition: 0.3s; /* smooth effect */
    }

    .card:hover {
        box-shadow: 0 40px 80px rgba(0,0,0,0.3);
    }


    .dark {
        background: #2f2f4f;
        border: 1px solid rgba(225,225, 225, 0.5);
        color: #ccc;
    }

    .light {
        background: cyan;
        color: #333;
        border: 1px solid rgba(225,225, 225, 0.5);
    }

    button {
        margin-top: 10px;
        padding: 10px 25px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        border: 1px solid rgba(225, 225, 225, 0.5);
    }

    
    
    p {
        padding-top: 20px;
    }

    .dark button {
        background: white;
        color: #333;

    }

    .light button {
        background: #2f2f4f;
        color: white;
    }

    button:hover {
        opacity: 0.85;
    }

    /*login selection design*/
    #loginOptions {
        display: none;
        flex-direction: column;
        gap: 10px;
        width: 300px;
        height: 280px;
        align-items: center;
        border-radius: 5px;
        

    }
    #loginOptions button{

        width: 150px;
        background: cyan;
        font-family: Arial, sans-serif;
        font: bold;
        
    }
    

</style>
</head>

<body>

<div class="container">
    <div class="logo-container">
        <img src="logo.png" alt="Dream Dormitory Logo" class="main-logo">
    </div>
    <div class="headerTittle">Dream Dormitory</div>
    <div class="lowersubtitle">Your Budget Meets Comfort</div>

    <!---------------- Choices-------------------->
    <div class="choices" id="choices">
        <div class="card dark">
            <p>I already have an account</p>
            <button onclick="showLoginOptions()">Login</button>
        </div>

        <div class="card light">
            <p>I'm new here!</p>
            <button onclick="window.location.href='Register.php'">Create an account</button>
        </div>
    </div>

    <!-------------------- selection-------->
    <div class="selectionFrame" id="loginOptions">
        <p class="select_subt">Select Login Type</p>
        <button onclick="window.location.href='admin_login.php'">Admin</button>
        <button onclick="window.location.href='user_login.php'">User</button>
        <button onclick="goBack()">Back</button>
    </div>

    <div class="contact-info">
        <p>Contact Us</p>
        <p><span>Facebook:</span> Dream Dormitory</p>
        <p><span>Instagram:</span> @dreamdormitory</p>
    </div>
</div>

<script>
function showLoginOptions() {
    document.getElementById("choices").style.display = "none";
    document.getElementById("loginOptions").style.display = "flex";


}

function goBack() {
    document.getElementById("choices").style.display = "flex";
    document.getElementById("loginOptions").style.display = "none";
}
</script>

</body>
</html>
